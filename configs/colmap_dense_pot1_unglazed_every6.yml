project:
  name: pot1-unglazed_every6

colmap:
  executable: "C:/Tools/COLMAP-4.1.1/bin/colmap.exe"

input:
  images: data/frames_output/pot1-unglazed_every6_frames
  masks: data/processed/pot1-unglazed_every6/masks_colmap
  sparse_model: data/processed/pot1-unglazed_every6/colmap_sparse_masked_sequential/sparse/0

output:
  workspace: data/processed/pot1-unglazed_every6/colmap_dense_masked_sequential
  masked_images: inputs/masked_rgb
  mask_undistortion_images: inputs/mask_images_for_undistortion
  undistorted_images: images
  undistorted_masks: masks
  fused_point_cloud: results/fused.ply
  poisson_mesh: results/meshed-poisson.ply
  simplified_poisson_mesh: results/meshed-poisson-simplified.ply
  delaunay_mesh: results/meshed-delaunay.ply
  # Raw textured classical baseline. Keep mesh.ply beside texture.png.
  textured_mesh: results/raw_classical_baseline
  logs: logs
  run_manifest: run_manifest.json

masking:
  background_value: 0
  threshold: 128
  reconstruction_dilation_pixels: 5
  fusion_erosion_pixels: 1
  jpeg_quality: 100

undistortion:
  output_type: COLMAP
  max_image_size: 2000
  jpeg_quality: 100
  num_threads: 2

patch_match:
  gpu_index: 0
  max_image_size: 1200
  cache_size_gb: 6
  num_threads: 2
  geom_consistency: true
  filter: true

fusion:
  input_type: geometric
  max_image_size: 1200
  cache_size_gb: 6
  num_threads: 4
  min_num_pixels: 3

meshing:
  run_poisson: true
  run_delaunay: true
  poisson:
    point_weight: 1.0
    depth: 11
    color: true
    trim: 5.0
    num_threads: 4
  delaunay:
    input_type: dense
    max_proj_dist: 20.0
    max_depth_dist: 0.05
    visibility_sigma: 3.0
    distance_sigma_factor: 1.0
    quality_regularization: 1.0
    max_side_length_factor: 25.0
    max_side_length_percentile: 95.0
    num_threads: 4
  simplification:
    target_face_ratio: 0.1
    max_error: 0.0
    boundary_weight: 1000.0
    interpolate_colors: true
    num_threads: 4

texturing:
  output_type: BIN
  min_cos_normal_angle: 0.1
  min_visible_vertices: 3
  view_selection_smoothing_iterations: 3
  atlas_patch_padding: 4
  inpaint_radius: 5
  apply_color_correction: true
  color_correction_regularization: 0.1
  texture_scale_factor: 1.0
  num_threads: 4

runtime:
  resume: true
  stop_on_error: true
